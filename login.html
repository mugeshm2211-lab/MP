<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>வாங்க வணக்கம் 💖</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Tamil:wght@400;700;800&display=swap');

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Noto Sans Tamil', sans-serif;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    background: linear-gradient(135deg, #ff758c, #ff7eb3, #a18cd1);
    background-size: 300% 300%;
    animation: gradient 8s ease infinite;
}

@keyframes gradient {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

.login-box {
    width: 100%;
    max-width: 400px;
    padding: 35px 28px;
    border-radius: 25px;
    text-align: center;
    background: rgba(255, 255, 255, 0.2);
    backdrop-filter: blur(15px);
    border: 1px solid rgba(255, 255, 255, 0.5);
    box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
}

.heart {
    font-size: 50px;
    margin-bottom: 15px;
}

h1 {
    color: white;
    font-size: 30px;
    font-weight: 800;
    margin-bottom: 12px;
    text-shadow: 2px 3px 8px rgba(100, 0, 70, 0.3);
}

.subtitle {
    color: white;
    margin-bottom: 25px;
    font-size: 14px;
}

.input-group {
    text-align: left;
    margin-bottom: 18px;
}

label {
    display: block;
    color: white;
    font-weight: 700;
    margin-bottom: 8px;
}

input {
    width: 100%;
    padding: 13px;
    border: 2px solid transparent;
    border-radius: 12px;
    outline: none;
    font-size: 15px;
    background: rgba(255, 255, 255, 0.95);
}

input:focus {
    border-color: #ff4f87;
    box-shadow: 0 0 10px #ffc2d5;
}

button {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(90deg, #ffe29f, #ffa99f);
    color: #7b2450;
    font-size: 17px;
    font-weight: 800;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 20px #9d4b7b66;
}

#message {
    margin-top: 20px;
    color: white;
    font-weight: 700;
    line-height: 1.8;
}

.footer {
    margin-top: 22px;
    color: white;
    font-size: 12px;
}
</style>
</head>

<body>

<div class="login-box">

    <div class="heart">💖</div>

    <h1>வாங்க வணக்கம் 🙏</h1>

    <p class="subtitle">Enter your details below ✨</p>

    <form id="loginForm">

        <div class="input-group">
            <label for="name">👤 Your Name</label>
            <input type="text" id="name"
                   placeholder="Enter your name"
                   maxlength="49" required>
        </div>

        <div class="input-group">
            <label for="age">🎂 Your Age</label>
            <input type="number" id="age"
                   placeholder="Enter your age"
                   min="1" max="120" required>
        </div>

        <button type="submit">💗 Login Now</button>

    </form>

    <div id="message" aria-live="polite"></div>

    <p class="footer">Made with Love 💕</p>

</div>

<script>
document.getElementById("loginForm").addEventListener(
    "submit", function(event) {
        event.preventDefault();

        const name = document.getElementById("name").value.trim();
        const age = Number(document.getElementById("age").value);
        const message = document.getElementById("message");

        if (!name || !Number.isInteger(age) ||
            age < 1 || age > 120) {
            message.textContent = "Please enter valid details!";
            return;
        }

        message.textContent =
            "🎉 வாங்க " + name + "! 💖 வயது: " + age;
    }
);
</script>

</body>
</html>
