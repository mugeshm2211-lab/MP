
<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Love Questions ❤️</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(-45deg,
        #ff0844, #ff61a6, #9b5de5, #00bbf9);
    background-size: 400% 400%;
    animation: gradient 10s ease infinite;
    padding: 20px;
}

@keyframes gradient {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

.hearts span {
    position: absolute;
    bottom: -50px;
    font-size: 25px;
    animation: float 9s linear infinite;
    opacity: 0.8;
    pointer-events: none;
}

.hearts span:nth-child(1) { left: 10%; animation-delay: 0s; }
.hearts span:nth-child(2) { left: 25%; animation-delay: 2s; }
.hearts span:nth-child(3) { left: 45%; animation-delay: 4s; }
.hearts span:nth-child(4) { left: 65%; animation-delay: 1s; }
.hearts span:nth-child(5) { left: 85%; animation-delay: 3s; }

@keyframes float {
    0% { transform: translateY(0) rotate(0); opacity: 0; }
    20% { opacity: 0.8; }
    100% { transform: translateY(-115vh) rotate(360deg); opacity: 0; }
}

.card {
    width: 100%;
    max-width: 440px;
    padding: 35px 25px;
    text-align: center;
    border-radius: 28px;
    color: #fff;
    background: rgba(255, 255, 255, 0.17);
    border: 1px solid rgba(255, 255, 255, 0.45);
    box-shadow: 0 15px 45px rgba(60, 0, 60, 0.25);
    backdrop-filter: blur(15px);
    position: relative;
    z-index: 2;
    animation: appear 0.8s ease;
}

@keyframes appear {
    from { opacity: 0; transform: translateY(30px) scale(.95); }
    to { opacity: 1; transform: translateY(0) scale(1); }
}

.emoji {
    font-size: 55px;
    animation: beat 1s infinite;
}

@keyframes beat {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.15); }
}

h1 {
    font-size: 27px;
    margin: 12px 0;
}

.subtitle {
    font-size: 14px;
    margin-bottom: 25px;
    color: #fff1f7;
}

.progress {
    height: 7px;
    background: rgba(255,255,255,.3);
    border-radius: 20px;
    margin-bottom: 25px;
    overflow: hidden;
}

#bar {
    height: 100%;
    width: 25%;
    background: #fff;
    border-radius: 20px;
    transition: width .4s;
}

#number {
    font-size: 13px;
    margin-bottom: 10px;
    opacity: .9;
}

#question {
    font-size: 21px;
    margin-bottom: 22px;
}

input {
    width: 100%;
    padding: 14px;
    border: 2px solid rgba(255,255,255,.6);
    border-radius: 14px;
    outline: none;
    font-size: 16px;
    color: #6b1646;
    background: rgba(255,255,255,.95);
    margin-bottom: 20px;
}

input:focus {
    border-color: #ffcae2;
    box-shadow: 0 0 15px #ff9bc8;
}

button {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 14px;
    background: linear-gradient(90deg, #ff2e78, #ff75a0);
    color: white;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 5px 18px rgba(120,0,60,.2);
    transition: transform .2s;
}

button:hover {
    transform: scale(1.04);
}

button:active {
    transform: scale(.97);
}

#message {
    margin-top: 18px;
    font-size: 14px;
}

@media (max-width: 400px) {
    .card { padding: 28px 20px; }
    h1 { font-size: 24px; }
    #question { font-size: 19px; }
}
</style>
</head>

<body>

<div class="hearts">
    <span>❤️</span>
    <span>💖</span>
    <span>💕</span>
    <span>💗</span>
    <span>💘</span>
</div>

<div class="card">
    <div class="emoji">💌</div>
    <h1> SUMMATHAN KEKKUREN ❤️</h1>
    <p class="subtitle">
        Unkitta konjam questions kekkanum! 😜
    </p>

    <div class="progress">
        <div id="bar"></div>
    </div>

    <p id="number">Question 1 of 4</p>
    <h2 id="question">Enna eppo first meet panna? 🥰</h2>

    <form id="quiz">
        <input
            type="text"
            id="answer"
            placeholder="Un answer inga type pannu..."
            autocomplete="off"
            required
        >
        <button type="submit" id="next">
            Next ❤️ →
        </button>
    </form>

    <p id="message"></p>
</div>

<script>
const questions = [
    "Enna eppo first meet panna? 🥰",
    "Yaaraiyavathu love panriya? 💕",
    "Unnoda crush name enna? 😏",
    "Enna pathi unakku enna theriyum? ❤️"
];

let current = 0;
let answers = [];

const form = document.getElementById("quiz");
const answer = document.getElementById("answer");
const question = document.getElementById("question");
const number = document.getElementById("number");
const bar = document.getElementById("bar");
const next = document.getElementById("next");
const message = document.getElementById("message");

form.addEventListener("submit", function(event) {
    event.preventDefault();

    const value = answer.value.trim();

    if (!value) {
        message.textContent = "Answer sollu please! 🥺❤️";
        return;
    }

    answers.push(value);

    if (current < questions.length - 1) {
        current++;
        question.textContent = questions[current];
        number.textContent =
            `Question ${current + 1} of ${questions.length}`;
        bar.style.width =
            `${((current + 1) / questions.length) * 100}%`;

        answer.value = "";
        answer.placeholder = "Un answer inga type pannu...";
        message.textContent = "";
        next.textContent =
            current === questions.length - 1
            ? "Finish 💖"
            : "Next ❤️ →";
    } else {
        showResult();
    }
});

function showResult() {
    document.querySelector(".emoji").textContent = "🥹💖";
    document.querySelector("h1").textContent = "Awww! ❤️";
    document.querySelector(".subtitle").textContent =
        "Un answers ellame mudichitta!";
    number.textContent = "Quiz completed ✨";
    bar.style.width = "100%";

    question.innerHTML =
        "Thank you for answering! 💕<br><br>" +
        "Nee romba special! 🫶";

    form.style.display = "none";
    message.innerHTML =
        "💌 Un answers indha page-la mattum irukku.<br>" +
        "Yaarukkum automatic-ah send aagadhu.";
}
</script>

</body>
</html>
